aid: fluid-truck
name: Fluid Truck
description: 'Fluid Truck was a Denver, Colorado peer-to-peer commercial vehicle sharing
  platform founded in 2016 by James Eberhard and Jenifer Snyder, often described as
  "the Zipcar of commercial vehicles". It operated an app-based, self-service rental
  marketplace for cargo vans, box trucks and flatbeds across roughly 400 cities in
  32 US states, and ran the Fluid Vehicle Investor Program (FVIP) through which individuals
  and small businesses bought fleets that Fluid managed and rented out. The company
  raised over $80 million in venture funding, filed for Chapter 11 bankruptcy in Delaware
  in October 2024 after an $20.6 million cash loss in 2023, sold substantially all
  assets to Kingbee Rentals in December 2024, and the case converted to Chapter 7 liquidation
  in September 2025. The company is wound down: no developer program, API documentation,
  or machine-readable contract was ever published, and its own web properties no longer
  serve a valid TLS certificate.'
